name: Astro Mechanica
description: >-
  Astro Mechanica is a San Francisco aerospace company, founded in 2021 by Ian
  Brooke, reinventing supersonic flight for a new jet age. Its flagship Duality
  electric combined-cycle engine is engineered to stay efficient from takeoff
  through Mach 3+ by reconfiguring between turbofan, turbojet, and ramjet modes
  using a hybrid turboelectric architecture. The company designs engines,
  airframes, and flight systems in-house, has been selected to develop an engine
  for the U.S. Air Force Collaborative Combat Aircraft (CCA) program, and is
  backed by a16z, Lowercarbon Capital, and Y Combinator. It was added to the API
  Evangelist network as an a16z portfolio company. As an aerospace hardware
  manufacturer, Astro Mechanica publishes no public developer API, SDK, or
  developer portal; this profile captures the company's public web and identity
  surface only.
